name: nas-image

# Builds the x64-linux runtime image from this branch, the same way release.yml builds
# sist2app/sist2:<version>-x64-linux, and pushes it to GHCR for the NAS.
on:
  push:
    branches: [clara/nas-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: runtime image (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      DOCKER_BUILD_SUMMARY: false

    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:x64-linux-exif-datetimeoriginal
            ${{ env.GHCR_IMAGE }}:x64-linux-exif-datetimeoriginal-${{ steps.sha.outputs.short }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}-buildcache:x64-glibc
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}-buildcache:x64-glibc,mode=max
